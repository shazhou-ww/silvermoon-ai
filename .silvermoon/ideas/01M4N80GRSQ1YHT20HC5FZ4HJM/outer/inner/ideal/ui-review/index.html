<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silvermoon Relay 登录页重设计</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef3f8;
      --surface: #fff;
      --ink: #142033;
      --muted: #687487;
      --border: #d8dfe8;
      --accent: #3454d1;
      --accent-soft: #e3e8fb;
      --signal: #c95755;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #fff 0, transparent 28rem),
        var(--canvas);
      font: 14px/1.5 "Aptos", "Segoe UI Variable Text", "Segoe UI", sans-serif;
    }
    a { color: inherit; }
    a:focus-visible, iframe:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 32%, transparent);
      outline-offset: 2px;
    }
    header, main, footer {
      width: min(1480px, calc(100% - 40px));
      margin-inline: auto;
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 27px; line-height: 1.2; }
    header p { max-width: 72ch; margin: 6px 0 0; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
    .status::before { width: 8px; height: 8px; background: var(--signal); border-radius: 50%; content: ""; }
    main { padding: 20px 0 40px; }
    .decision {
      display: grid;
      grid-template-columns: minmax(240px, 0.8fr) minmax(0, 1.2fr);
      gap: 24px;
      align-items: center;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    h2 { margin: 0; font-size: 18px; line-height: 1.35; }
    .deltas { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .deltas li { padding: 5px 8px; color: #243b95; background: var(--accent-soft); border-radius: 6px; font-size: 12px; font-weight: 650; }
    .tabs { display: flex; gap: 4px; margin-top: 18px; padding: 3px; background: #e2e8ef; border: 1px solid var(--border); border-radius: 9px; }
    .tab { padding: 7px 12px; color: var(--muted); border-radius: 6px; font-weight: 650; text-decoration: none; }
    .tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: 0 1px 3px #1420331f; }
    .frame-shell { margin-top: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    iframe { display: block; width: 100%; min-height: 760px; border: 0; }
    .review-end { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; margin-top: 18px; }
    .review-end p { margin: 0; color: var(--muted); }
    .review-end strong { color: var(--ink); }
    footer { padding-bottom: 28px; color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      header, main, footer { width: min(100% - 24px, 1480px); }
      header, .decision, .review-end { grid-template-columns: 1fr; }
      .status { white-space: normal; }
      .deltas { justify-content: flex-start; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; }
      .tab { text-align: center; }
      iframe { min-height: 1200px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Silvermoon Relay 登录页重设计</h1>
      <p>对比现有通用控制台入口与更明亮、由银月迎宾并在认证前解释 Relay 能力的新入口。</p>
    </div>
    <span class="status">说明性评审材料</span>
  </header>
  <main>
    <section class="decision" aria-labelledby="decision-title">
      <div>
        <p class="eyebrow">待评审决定</p>
        <h2 id="decision-title">继续调整并批准明亮月色、银月迎宾的 Relay 登录页界面。</h2>
      </div>
      <ul class="deltas" aria-label="关键变化">
        <li>能力信息优先</li>
        <li>银月作为迎宾向导</li>
        <li>大屏统一 panel 居中</li>
        <li>官方提供商图标</li>
      </ul>
    </section>
    <nav class="tabs" role="tablist" aria-label="选择评审场景">
      <a class="tab" role="tab" aria-selected="true" href="scenarios/01-primary-flow.html" target="scenario-frame">主要登录场景</a>
      <a class="tab" role="tab" aria-selected="false" href="scenarios/02-error-state.html" target="scenario-frame">OAuth 错误</a>
    </nav>
    <div class="frame-shell">
      <iframe id="scenario-frame" name="scenario-frame" src="scenarios/01-primary-flow.html" title="主要登录场景对比"></iframe>
    </div>
    <section class="review-end" aria-label="Review conclusion">
      <p>本材料仅用于说明和评审，不是生产 UI 或规范性行为契约。<a href="../Idea.md">Idea.md</a> 是方向边界与验收结果的规范来源。</p>
      <strong>这个登录页界面是否可以提交方向验收？</strong>
    </section>
  </main>
  <footer>当前未决：无；不新增角色出图，提供商图标使用各品牌官方资源。</footer>
  <script>
    const frame = document.querySelector("#scenario-frame");
    const tabs = [...document.querySelectorAll(".tab")];
    function selectTab(tab) {
      tabs.forEach((candidate) => candidate.setAttribute("aria-selected", String(candidate === tab)));
      frame.title = `${tab.textContent.trim()} comparison`;
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectTab(tab));
      tab.addEventListener("keydown", (event) => {
        let nextIndex = null;
        if (event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
        if (event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = tabs.length - 1;
        if (nextIndex === null) return;
        event.preventDefault();
        tabs[nextIndex].click();
        tabs[nextIndex].focus();
      });
    });
    window.addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || event.data?.type !== "ui-review:height") return;
      frame.style.height = `${Math.max(320, Number(event.data.height) || 0)}px`;
    });
  </script>
</body>
</html>
